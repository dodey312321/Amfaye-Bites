<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amfaye Bites</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#f8f4ee',
            brown: '#624c45',
            dark: '#25201e',
            orange: '#f04b17',
            lightorange: '#ff7b3e',
            muted: '#81736e',
          },
          fontFamily: {
            sans: ['Montserrat', 'Arial', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', Arial, sans-serif; }
    .font-display-em { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; }
    section[id] { scroll-margin-top: 80px; }
  </style>
</head>
<body class="text-dark bg-cream leading-[1.6]">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 w-full z-30 flex items-center justify-between px-4 sm:px-8 lg:px-[6%] py-4 text-white bg-[#8c6d62]/65 backdrop-blur-md transition-all duration-300">
    <a class="w-auto leading-[0.8]" href="#home">
      <span class="block text-2xl sm:text-3xl lg:text-[40px] font-normal tracking-[-2px]">Amfaye</span>
      <small class="block text-[10px] sm:text-xs font-light tracking-[1px]">BITES</small>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex items-center gap-6 xl:gap-[35px] ml-auto mr-6">
      <a class="text-xs xl:text-sm font-bold transition-opacity duration-200 hover:opacity-65" href="#home">HOME</a>
      <a class="text-xs xl:text-sm font-bold transition-opacity duration-200 hover:opacity-65" href="#story">OUR STORY</a>
      <a class="text-xs xl:text-sm font-bold transition-opacity duration-200 hover:opacity-65" href="#donuts">PRODUCTS</a>
      <a class="text-xs xl:text-sm font-bold transition-opacity duration-200 hover:opacity-65" href="#reviews">REVIEWS</a>
      <a class="text-xs xl:text-sm font-bold transition-opacity duration-200 hover:opacity-65" href="#branches">OUR BRANCHES</a>
    </nav>

   <!-- Header Actions -->
<div class="flex items-center gap-2 sm:gap-3 ml-auto lg:ml-0">
  <!-- NEW: LOGIN / SIGN UP BUTTON -->
  <button class="border border-white/70 bg-transparent text-white py-1.5 px-3 sm:py-[9px] sm:px-[14px] rounded-full cursor-pointer font-bold text-xs sm:text-sm flex items-center gap-1 hover:bg-white/10 active:scale-95 transition-all" id="openAuth" aria-label="Open auth modal">
    <span>LOGIN</span>
  </button>

  <button class="border border-white/70 bg-transparent text-white py-1.5 px-3 sm:py-[9px] sm:px-[14px] rounded-full cursor-pointer font-bold text-xs sm:text-sm flex items-center gap-1 hover:bg-white/10 active:scale-95 transition-all" id="openCart" aria-label="Open cart">
    <span>CART</span>
    <span id="cartCount" class="bg-orange rounded-full px-2 py-0.5 text-xs">0</span>
  </button>

  <button id="mobileMenuBtn" aria-label="Toggle navigation menu" class="lg:hidden text-white p-2 text-2xl focus:outline-none">
    <span id="menuIcon">☰</span>
  </button>
</div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobileMenu" class="absolute top-full left-0 w-full bg-[#1c1817]/95 backdrop-blur-lg flex-col p-6 gap-4 border-b border-white/10 hidden lg:hidden transition-all duration-300">
      <a class="mobile-nav-link text-sm font-bold py-2 border-b border-white/10" href="#home">HOME</a>
      <a class="mobile-nav-link text-sm font-bold py-2 border-b border-white/10" href="#story">OUR STORY</a>
      <a class="mobile-nav-link text-sm font-bold py-2 border-b border-white/10" href="#donuts">PRODCUTS</a>
      <a class="mobile-nav-link text-sm font-bold py-2 border-b border-white/10" href="#reviews">REVIEWS</a>
      <a class="mobile-nav-link text-sm font-bold py-2" href="#branches">OUR BRANCHES</a>
    </div>
  </header>

  <!-- MAIN SECTIONS -->
  <main>
    <div id="section-home"></div>
    <div id="section-story"></div>
    <div id="section-products"></div>
    <div id="section-reviews"></div>
    <div id="section-branches"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#211d1b] text-white text-center px-4 sm:px-5 pt-12 sm:pt-[60px] pb-6 sm:pb-[25px]">
    <div class="text-3xl sm:text-[42px] tracking-[-2px] mb-2 font-normal">amfaye's <small class="text-[11px] sm:text-[13px] tracking-[2px] block font-light">BITES</small></div>
    <p class="text-[#aaa09b] text-xs sm:text-sm">Bite sized, Love sized.</p>
    <div class="flex justify-center gap-3 my-5">
      <a href="#" aria-label="Facebook" class="w-9 h-9 border border-[#766b66] rounded-full grid place-items-center hover:bg-white/10 transition-colors">f</a>
      <a href="#" aria-label="Instagram" class="w-9 h-9 border border-[#766b66] rounded-full grid place-items-center hover:bg-white/10 transition-colors">◎</a>
    </div>
    <p class="text-[11px] text-[#aaa09b] mt-6 sm:mt-[30px]">© 2026 Amfaye's Bites. All rights reserved.</p>
  </footer>

  <!-- CART & MODALS CONTAINER -->
  <div id="cart-container"></div>

  <!-- Script to load components -->
  <script>
    async function loadComponent(elementId, filePath) {
      const res = await fetch(filePath);
      const html = await res.text();
      document.getElementById(elementId).innerHTML = html;
    }

    async function init() {
      await Promise.all([
        loadComponent('section-home', 'home.html'),
        loadComponent('section-story', 'story.html'),
        loadComponent('section-products', 'products.html'),
        loadComponent('section-reviews', 'reviews.html'),
        loadComponent('section-branches', 'branches.html'),
        loadComponent('cart-container', 'cart.html')
      ]);

      // Load script.js pagkatapos ma-render ang lahat ng HTML files
      const script = document.createElement('script');
      script.src = 'script.js';
      document.body.appendChild(script);
    }

    init();
  </script>
</body>
</html>
